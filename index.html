<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ことばタイピング</title>
<style>
:root{
  --paper:#F1F4EE;
  --paper-2:#FFFFFF;
  --ink:#1B2A2C;
  --ink-soft:#5C6E70;
  --rule:#C9D4CE;
  --ai:#2B5FAE;          /* 藍 */
  --ai-pale:#DCE6F5;
  --nanohana:#F3C22B;    /* 菜の花 */
  --midori:#3C8F68;
  --shu:#CE3F34;         /* 朱 */
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --maru:"Hiragino Maru Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--maru);
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    repeating-linear-gradient(to right, rgba(43,95,174,.055) 0 1px, transparent 1px 34px),
    repeating-linear-gradient(to bottom, rgba(43,95,174,.055) 0 1px, transparent 1px 34px);
  -webkit-text-size-adjust:100%;
}
#stage{max-width:760px;margin:0 auto;padding:18px 16px 40px;min-height:100%}
.hidden{display:none !important}

/* --- 見出し --- */
.masthead{display:flex;align-items:baseline;gap:12px;margin:6px 0 18px}
.masthead h1{
  font-family:var(--mincho);font-size:26px;font-weight:600;margin:0;letter-spacing:.12em;
}
.masthead p{margin:0;font-size:13px;color:var(--ink-soft)}

/* --- カード --- */
.sheet{
  background:var(--paper-2);border:1px solid var(--rule);border-radius:10px;
  padding:18px 18px 20px;margin-bottom:14px;
}
.sheet h2{font-size:15px;margin:0 0 12px;font-weight:700;color:var(--ink)}

/* --- 学年えらび --- */
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade{
  appearance:none;border:1.5px solid var(--rule);background:var(--paper-2);
  border-radius:8px;padding:12px 4px;cursor:pointer;font-family:var(--maru);
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.grade b{font-family:var(--mincho);font-size:22px;font-weight:600;line-height:1}
.grade small{font-size:11px;color:var(--ink-soft)}
.grade[aria-pressed="true"]{border-color:var(--ai);background:var(--ai-pale)}
.grade[disabled]{opacity:.35;cursor:not-allowed}
.grade:focus-visible{outline:3px solid var(--nanohana);outline-offset:2px}

.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{
  display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--rule);
  border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;background:var(--paper-2);
}
.opt input{accent-color:var(--ai);width:16px;height:16px;margin:0}
.opt:has(input:checked){border-color:var(--ai);background:var(--ai-pale)}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.count-pick{display:flex;gap:6px}
.count-pick button{
  border:1.5px solid var(--rule);background:var(--paper-2);border-radius:8px;
  padding:8px 14px;font-family:var(--maru);font-size:14px;cursor:pointer;
}
.count-pick button[aria-pressed="true"]{border-color:var(--ai);background:var(--ai-pale)}

.start{
  width:100%;margin-top:4px;border:none;border-radius:10px;background:var(--ai);color:#fff;
  font-family:var(--maru);font-size:19px;font-weight:700;padding:16px;cursor:pointer;letter-spacing:.08em;
}
.start:active{transform:translateY(1px)}
.start:focus-visible{outline:3px solid var(--nanohana);outline-offset:2px}
.best{font-size:12px;color:var(--ink-soft);margin:10px 0 0;text-align:center}
.mode-note{font-size:12px;color:var(--ink-soft);margin:10px 0 0}
.sub-label{font-size:12px;color:var(--ink-soft);margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--rule)}
.credit{font-size:11px;line-height:1.7;color:var(--ink-soft);margin:18px 4px 0}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.diff{border:1.5px solid var(--rule);background:var(--paper-2);border-radius:8px;padding:11px 4px;
  font-family:var(--maru);font-size:14px;cursor:pointer;color:var(--ink)}
.diff[aria-pressed="true"]{border-color:var(--ai);background:var(--ai-pale);font-weight:700}
.limit{display:flex;align-items:center;gap:10px;margin:-6px 0 14px}
.limit-bar{flex:1;height:7px;background:var(--rule);border-radius:4px;overflow:hidden}
.limit-bar i{display:block;height:100%;width:100%;background:var(--midori)}
.limit-bar i.low{background:var(--shu)}
.limit b{font-family:var(--mono);font-size:15px;min-width:1.6em;text-align:right}
.hist-btn{width:100%;margin-top:10px;border:1.5px solid var(--rule);background:var(--paper-2);
  border-radius:10px;font-family:var(--maru);font-size:15px;padding:13px;cursor:pointer;color:var(--ink)}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;border:1.5px solid var(--rule);background:var(--paper-2);border-radius:8px;
  padding:10px;font-family:var(--maru);font-size:14px;cursor:pointer}
.tabs button[aria-pressed="true"]{border-color:var(--ai);background:var(--ai-pale)}
.hlist{list-style:none;margin:0;padding:0}
.hlist li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--rule);font-size:13px}
.hlist li:last-child{border-bottom:none}
.hlist .when{font-family:var(--mono);font-size:12px;color:var(--ink-soft);min-width:5.4em}
.hlist .tag{font-size:11px;color:var(--ink-soft);min-width:5.2em}
.hlist .num{margin-left:auto;font-family:var(--mono);font-size:13px;white-space:nowrap}
.hlist .hw{font-family:var(--mincho);font-size:21px;min-width:2.8em}
.hlist .hw.en{font-family:var(--maru);font-size:16px;font-weight:700;min-width:6.4em}
.hlist .hy{font-size:12px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hlist .cnt{margin-left:auto;font-family:var(--mono);font-size:13px;white-space:nowrap}
.hlist .ngc{color:var(--shu)}
.empty{font-size:13px;color:var(--ink-soft);text-align:center;padding:24px 0}
.hnote{font-size:11px;color:var(--ink-soft);margin:12px 0 0}
.grade.adv b{font-family:var(--maru);font-size:15px;font-weight:700;letter-spacing:0}

/* --- プレイ画面 --- */
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-soft);margin-bottom:10px}
.bar .q{font-family:var(--mono)}
.quit{border:1px solid var(--rule);background:var(--paper-2);border-radius:7px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:var(--maru);color:var(--ink-soft)}
.track{height:5px;background:var(--rule);border-radius:3px;overflow:hidden;margin-bottom:16px}
.track i{display:block;height:100%;background:var(--ai);width:0;transition:width .18s ease}

.card{position:relative;text-align:center;padding:22px 10px 24px}
.yomi{
  font-family:var(--mincho);font-size:19px;letter-spacing:.28em;color:var(--ink-soft);
  min-height:26px;margin-bottom:10px;
}
.yomi.off{visibility:hidden}
.yomi.prompt{font-size:30px;letter-spacing:.06em;color:var(--ink);min-height:38px;margin-bottom:16px}
.boxes{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.box{
  width:82px;height:82px;border:2px solid var(--rule);border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mincho);font-size:54px;line-height:1;color:var(--ink-soft);
  background:
    linear-gradient(to right, transparent calc(50% - .5px), rgba(43,95,174,.12) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px)),
    linear-gradient(to bottom, transparent calc(50% - .5px), rgba(43,95,174,.12) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px));
  transition:color .2s, border-color .2s, background-color .2s;
}
.box.done{color:var(--ai);border-color:var(--ai);background-color:#F5F8FD}
.box.en{width:46px;height:62px;font-family:var(--maru);font-size:30px;font-weight:700;background-image:none}
.box.en.ghost{color:transparent}
.box.en.gap{width:16px;border:none;background:none}
.typed{white-space:pre}
.imi{margin:16px 0 4px;font-size:14px;color:var(--ink-soft)}

.romaji{
  font-family:var(--mono);font-size:24px;letter-spacing:.06em;margin:14px 0 4px;
  word-break:break-all;min-height:32px;
}
.romaji .typed{color:var(--midori)}
.romaji .next{background:var(--nanohana);border-radius:3px;padding:0 2px}
.romaji .rest{color:var(--ink-soft)}
.guide.off{visibility:hidden}
.romaji .caret{
  display:inline-block;width:2px;height:1em;background:var(--ink);
  vertical-align:-.12em;margin:0 1px;animation:blink 1.1s step-end infinite;
}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.card.shake{animation:sh .22s}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

.hanko{
  position:absolute;top:14px;right:6px;width:86px;height:86px;border-radius:50%;
  border:4px solid var(--shu);color:var(--shu);font-family:var(--mincho);font-weight:600;
  display:flex;align-items:center;justify-content:center;font-size:30px;letter-spacing:.05em;
  opacity:0;transform:scale(1.7) rotate(-18deg);pointer-events:none;
}
.hanko.on{animation:stamp .9s ease-out}
@keyframes stamp{
  0%{opacity:0;transform:scale(1.7) rotate(-18deg)}
  18%{opacity:1;transform:scale(1) rotate(-11deg)}
  70%{opacity:1;transform:scale(1) rotate(-11deg)}
  100%{opacity:0;transform:scale(1) rotate(-11deg)}
}

/* --- キーボード --- */
.kb{margin-top:18px;display:flex;flex-direction:column;gap:5px;align-items:center}
.kb-row{display:flex;gap:5px;justify-content:center}
.key{
  width:38px;height:40px;border:1px solid var(--rule);border-radius:6px;background:var(--paper-2);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;
  color:var(--ink-soft);position:relative;
}
.key.left{background:#F4F7FB}
.key.right{background:#FBF7F1}
.key.space{width:190px;font-size:11px;color:var(--ink-soft)}
.key.home::after{content:"";position:absolute;bottom:5px;width:11px;height:2px;background:var(--rule);border-radius:2px}
.key.hit{background:var(--nanohana);border-color:#D9A800;color:var(--ink);font-weight:700}
.kb.off{display:none}

.spk-row{display:flex;justify-content:center;margin-top:14px}
.spk{border:1.5px solid var(--rule);background:var(--paper-2);border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ai);
  width:44px;height:44px;padding:0}
.spk:active{transform:translateY(1px)}
.spk:focus-visible{outline:3px solid var(--nanohana);outline-offset:2px}
.spk svg{width:21px;height:21px}
.spk.sm{width:30px;height:30px;margin-left:8px;flex:none}
.spk.sm svg{width:15px;height:15px}
.pass-row{display:flex;justify-content:center;margin-top:16px}
.pass{
  border:1.5px solid var(--rule);background:var(--paper-2);border-radius:999px;
  padding:9px 26px;font-family:var(--maru);font-size:14px;color:var(--ink-soft);cursor:pointer;
}
.pass:active{transform:translateY(1px)}
.pass:focus-visible{outline:3px solid var(--nanohana);outline-offset:2px}
.tap-hint{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:12px}
#catcher{position:absolute;opacity:0;width:1px;height:1px;left:-9999px}

/* --- けっか --- */
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin-bottom:6px}
.score div b{display:block;font-family:var(--mincho);font-size:32px;font-weight:600;color:var(--ai)}
.score div span{font-size:12px;color:var(--ink-soft)}
.review{list-style:none;margin:0;padding:0}
.review li{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--rule)}
.review li:last-child{border-bottom:none}
.review .kw{font-family:var(--mincho);font-size:26px;min-width:2.6em}
.review .kw.en{font-family:var(--maru);font-size:19px;font-weight:700;min-width:5.6em}
.review .kd b{font-size:13px;font-weight:700;display:block}
.review .kd span{font-size:12px;color:var(--ink-soft)}
.review .mark{margin-left:auto;font-size:18px}
.mark.ok{color:var(--midori)}
.mark.ng{color:var(--shu)}
.mark.pass{color:var(--ink-soft);font-size:12px}
.misskeys{font-family:var(--mono);font-size:14px;color:var(--ink)}

@media (max-width:560px){
  .box{width:64px;height:64px;font-size:42px}
  .box.en{width:36px;height:50px;font-size:23px}
  .box.en.gap{width:10px}
  .yomi.prompt{font-size:24px}
  .key{width:30px;height:34px;font-size:12px}
  .key.space{width:150px}
  .romaji{font-size:20px}
  .grades{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
  .hanko.on{opacity:1;transform:scale(1) rotate(-11deg)}
}
</style>
</head>
<body>
<div id="stage">
  <header class="masthead">
    <h1>ことばタイピング</h1>
    <p data-t="sub"></p>
  </header>

  <!-- ======== スタート ======== -->
  <section id="scr-start">
    <div class="sheet">
      <h2 data-t="h_mode"></h2>
      <div class="count-pick" id="modes"></div>
      <p class="mode-note" id="modeNote"></p>
    </div>

    <div class="sheet">
      <h2 data-t="h_grade"></h2>
      <div class="grades" id="grades"></div>
      <p class="sub-label" data-t="h_adv"></p>
      <div class="grades" id="grades2"></div>
    </div>

    <div class="sheet">
      <h2 data-t="h_count"></h2>
      <div class="count-pick" id="counts"></div>
    </div>

    <div class="sheet">
      <h2 data-t="h_diff"></h2>
      <div class="diffs" id="diffs"></div>
      <p class="mode-note" id="diffNote"></p>
      <div class="opts" style="margin-top:14px">
        <label class="opt"><input type="checkbox" id="optSound" checked><span data-t="opt_sound"></span></label>
      </div>
    </div>

    <button class="start" id="btnStart" data-t="btn_start"></button>
    <p class="best" id="bestLine"></p>
    <button class="hist-btn" id="btnHist" data-t="btn_hist"></button>
    <p class="credit">英単語のCEFRレベルは『CEFR-J Wordlist Version 1.6』（東京外国語大学 投野由紀夫研究室）に準拠。日本語訳は本アプリ独自。漢字の学年は文部科学省「学年別漢字配当表」、漢検2級は日本漢字能力検定の級別配当による。</p>
  </section>

  <!-- ======== プレイ ======== -->
  <section id="scr-play" class="hidden">
    <div class="bar">
      <span class="q" id="qCount">1 / 10</span>
      <span id="liveStat"></span>
      <button class="quit" id="btnQuit" data-t="btn_quit"></button>
    </div>
    <div class="track"><i id="trackFill"></i></div>
    <div class="limit hidden" id="limitWrap"><span class="limit-bar"><i id="limitFill"></i></span><b id="limitNum"></b></div>

    <div class="sheet">
      <div class="card" id="card">
        <div class="hanko" id="hanko">合格</div>
        <div class="yomi" id="yomi"></div>
        <div class="boxes" id="boxes"></div>
        <p class="imi" id="imi"></p>
        <div class="spk-row hidden" id="spkRow"><button class="spk" id="btnSpeak" type="button" aria-label="発音を聞く"></button></div>
        <div class="romaji" id="romaji"><span class="typed" id="rTyped"></span><i class="caret"></i><span class="guide" id="rGuide"></span></div>
      </div>
      <div class="pass-row"><button class="pass" id="btnPass" data-t="btn_pass"></button></div>
      <div class="kb" id="kb"></div>
      <p class="tap-hint hidden" id="tapHint" data-t="tap_hint"></p>
    </div>
    <input id="catcher" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="latin">
  </section>

  <!-- ======== きろく ======== -->
  <section id="scr-hist" class="hidden">
    <div class="sheet">
      <div class="tabs" id="histTabs">
        <button type="button" data-tab="score" aria-pressed="true" data-t="tab_score"></button>
        <button type="button" data-tab="words" aria-pressed="false" data-t="tab_words"></button>
      </div>

      <div id="tab-score">
        <ul class="hlist" id="scoreList"></ul>
        <p class="hnote" id="scoreNote"></p>
      </div>

      <div id="tab-words" class="hidden">
        <div class="tabs" id="wordSort">
          <button type="button" data-sort="n" aria-pressed="true" data-t="sort_n"></button>
          <button type="button" data-sort="ng" aria-pressed="false" data-t="sort_ng"></button>
        </div>
        <ul class="hlist" id="wordList"></ul>
        <p class="hnote" id="wordNote"></p>
      </div>
    </div>
    <button class="start" id="btnHistBack" data-t="btn_back"></button>
    <p class="best"><button class="quit" id="btnHistClear" data-t="btn_clear"></button></p>
  </section>

  <!-- ======== けっか ======== -->
  <section id="scr-result" class="hidden">
    <div class="sheet">
      <h2 id="resultTitle"></h2>
      <div class="score">
        <div><b id="rSpeed">0</b><span data-t="u_speed"></span></div>
        <div><b id="rAcc">0%</b><span data-t="u_acc"></span></div>
        <div><b id="rClear">0</b><span data-t="u_clear"></span></div>
      </div>
      <p class="best" id="rBest"></p>
    </div>
    <div class="sheet">
      <h2 data-t="h_review"></h2>
      <ul class="review" id="review"></ul>
    </div>
    <div class="sheet" id="missSheet">
      <h2 data-t="h_miss"></h2>
      <p class="misskeys" id="missKeys"></p>
    </div>
    <button class="start" id="btnAgain" data-t="btn_again"></button>
    <p class="best"><button class="quit" id="btnHome" data-t="btn_home"></button></p>
  </section>
</div>

<script>

   ["左右","さゆう","ひだりと みぎ"],
   ["上下","じょうげ","うえと した"],
   ["目玉","めだま","目の まるい ところ"],
   ["火山","かざん","土の中の 火が ふき出す 山"],

   ["公園","こうえん","みんなで あそべる ひろい ところ"],

};
const VOWELS = "aiueo";

function tokenize(yomi){
  const raw=[];
  for(let i=0;i<yomi.length;){
    const two=yomi.slice(i,i+2);
    if(KANA[two]){raw.push(two);i+=2;continue;}
    raw.push(yomi[i]);i+=1;
  }
  const units=[];
  for(let i=0;i<raw.length;i++){
    const k=raw[i];
    if(k==="っ"){
      const nxt=raw[i+1]&&KANA[raw[i+1]]?KANA[raw[i+1]]:null;
      const set=new Set(["xtu","ltu","ltsu"]);
      if(nxt) nxt.forEach(c=>{ if(!VOWELS.includes(c[0])) set.add(c[0]); });
      units.push({kana:k,cands:[...set].sort((a,b)=>a.length-b.length)});
      continue;
    }
    if(k==="ん"){
      const nk=raw[i+1];
      const nc=nk&&KANA[nk]?KANA[nk][0]:null;
      const needDouble = !nc || VOWELS.includes(nc[0]) || nc[0]==="n" || nc[0]==="y";
      units.push({kana:k,cands: needDouble?["nn","xn"]:["n","nn","xn"]});
      continue;
    }
    units.push({kana:k,cands:(KANA[k]||[k]).slice()});
  }
  return units;
}

let AC=null;
function beep(freq,dur,type){
  if(!$("optSound").checked) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"sine";o.frequency.value=freq;
    g.gain.setValueAtTime(.06,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);
  }catch(e){}
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildPool(){
  if(S.mode==="review") return reviewPool();
  const k=(WORDS[S.grade]||[]).map(a=>({t:"k",w:a[0],y:a[1],m:a[2]}));
  const e=(EN_WORDS[S.grade]||[]).map(a=>({t:"e",w:a[0],y:a[1],m:a[2]}));
  if(S.mode==="kanji") return k;
  if(S.mode==="en") return e;
  return k.concat(e);

  const pool=buildPool();

    if(S.mode==="review") $("modeNote").textContent=T("review_none");

  if(S.mode==="review"){
    // 苦手な順に上位を取り出してから、出る順番をまぜる
    S.queue=shuffle(pool.slice(0,S.count));
  }else{
    shuffle(pool);
    S.queue=[];
    while(S.queue.length<S.count){ S.queue=S.queue.concat(pool); }
    S.queue=S.queue.slice(0,S.count);
  }
  S.count=S.queue.length;
  S.qi=0;S.keysOK=0;S.keysNG=0;S.missMap={};S.results=[];S.startedAt=0;S.running=true;S.locked=false;
  $("scr-start").classList.add("hidden");
  $("scr-result").classList.add("hidden");
  $("scr-play").classList.remove("hidden");
  $("rGuide").classList.toggle("off",!D().guide);
  $("kb").classList.toggle("off",!D().kb);
  focusCatcher();
  loadWord();
}

function loadWord(){
  const it=S.queue[S.qi];
  S.cur=it;S.ui=0;S.buf="";S.typed="";S.locked=false;
  S.results.push({t:it.t,w:it.w,y:it.y,m:it.m,miss:0});
  $("qCount").textContent=`${S.qi+1} / ${S.count}`;
  $("imi").textContent = it.t==="e" ? "" : it.m;
  const yo=$("yomi"), bx=$("boxes");
  bx.innerHTML="";
  if(it.t==="e"){
    S.units=[...it.w.toLowerCase()].map(ch=>({kana:ch,cands:[ch]}));
    yo.classList.add("prompt");yo.classList.remove("off");
    yo.textContent=it.y;
    [...it.w].forEach(ch=>{
      const d=document.createElement("div");
      if(ch===" "){ d.className="box en gap"; }
      else { d.className="box en"; d.textContent=ch; }
      bx.appendChild(d);
    });
  }else{
    S.units=tokenize(it.y);
    yo.classList.remove("prompt");
    const a=D().ans;
    yo.classList.toggle("off",!a);
    yo.textContent = a==="first"
      ? it.y.slice(0,1)+"○".repeat(Math.max(0,it.y.length-1))
      : it.y;
    [...it.w].forEach(ch=>{
      const d=document.createElement("div");d.className="box";d.textContent=ch;bx.appendChild(d);
    });
  }
  render();
  startLimit();
  const canSpk = !!window.speechSynthesis;
  $("spkRow").classList.toggle("hidden", !(canSpk && it.t==="e" && D().say==="ask"));
  if(it.t==="e" && D().say==="ask") speakEn(it.w);
}

function render(){
  let next="",rest="",p=0;
  if(S.cur&&S.cur.t==="e"){
    const w=S.cur.w;
    next=w.slice(S.ui,S.ui+1);rest=w.slice(S.ui+1);
    p=w.length?S.ui/w.length:0;
  }else{
    const cur=S.units[S.ui];
    if(cur){
      const cand=cur.cands.find(c=>c.startsWith(S.buf))||cur.cands[0];
      next=cand.slice(S.buf.length,S.buf.length+1);
      rest=cand.slice(S.buf.length+1);
    }
    for(let i=S.ui+1;i<S.units.length;i++) rest+=S.units[i].cands[0];
    p=S.units.length?S.ui/S.units.length:0;
  }
  $("rTyped").textContent=S.typed;
  $("rGuide").innerHTML=`<span class="next">${esc(next)}</span><span class="rest">${esc(rest)}</span>`;
  hintKey(next.toLowerCase());

  const boxes=$("boxes").children;
  if(S.cur&&S.cur.t==="e"){
    const a=D().ans;
    [...boxes].forEach((b,i)=>{
      const reveal = a===1 || (a==="first"&&i===0) || i<S.ui;
      b.classList.toggle("done",i<S.ui);
      b.classList.toggle("ghost",!reveal);
    });
  }else{
    const filled=Math.floor(p*boxes.length+1e-9);
    [...boxes].forEach((b,i)=>b.classList.toggle("done",i<filled));
  }

  const done=(S.qi+p)/S.count;
  $("trackFill").style.width=(done*100).toFixed(1)+"%";
  updateLive();
}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function updateLive(){
  const min=S.startedAt?(Date.now()-S.startedAt)/60000:0;
  const spd=min>0?Math.round(S.keysOK/min):0;
  const tot=S.keysOK+S.keysNG;
  const acc=tot?Math.round(S.keysOK/tot*100):100;
  $("liveStat").textContent=`${spd} ${T("u_speed")} ・ ${T("acc")} ${acc}%`;
}

function handleKey(chRaw){
  if(!S.running||S.locked) return false;
  const ch=chRaw.toLowerCase();
  if(!/^[a-z\- ]$/.test(ch)) return false;
  if(!S.startedAt) S.startedAt=Date.now();
  const cur=S.units[S.ui];
  if(!cur) return true;
  const test=S.buf+ch;

  if(cur.cands.some(c=>c.startsWith(test))){
    S.buf=test;
    S.typed+=ch;
    S.keysOK++;
    const exact=cur.cands.includes(test);
    const longer=cur.cands.some(c=>c.length>test.length&&c.startsWith(test));
    if(exact&&!longer) advance();
    beep(720,.05);
    render();
    if(S.ui>=S.units.length) setTimeout(wordDone,80);
    return true;
  }
  // 区切りをまたぐケース（「ん」のあとなど）
  if(cur.cands.includes(S.buf)){
    advance();
    const nx=S.units[S.ui];
    if(nx&&nx.cands.some(c=>c.startsWith(ch))){
      S.buf=ch;S.typed+=ch;S.keysOK++;
      const exact=nx.cands.includes(ch);
      const longer=nx.cands.some(c=>c.length>1&&c.startsWith(ch));
      if(exact&&!longer) advance();
      beep(720,.05);
      render();
      if(S.ui>=S.units.length) setTimeout(wordDone,80);
      return true;
    }
  }
  // ミス
  S.keysNG++;
  const want=(cur.cands.find(c=>c.startsWith(S.buf))||cur.cands[0]).slice(S.buf.length,S.buf.length+1);
  if(want) S.missMap[want]=(S.missMap[want]||0)+1;
  S.results[S.results.length-1].miss++;
  beep(180,.12,"square");
  const card=$("card");card.classList.remove("shake");void card.offsetWidth;card.classList.add("shake");
  updateLive();
  return true;
}
function advance(){S.ui++;S.buf="";}

function wordDone(){
  if(S.locked) return;
  S.locked=true;
  stopLimit();
  if(S.cur && S.cur.t==="e" && D().say==="done") speakEn(S.cur.w);
  const h=$("hanko");h.classList.remove("on");void h.offsetWidth;h.classList.add("on");
  beep(980,.09);setTimeout(()=>beep(1320,.12),90);
  [...$("boxes").children].forEach(b=>{b.classList.add("done");b.classList.remove("ghost");});
  S.qi++;
  setTimeout(()=>{
    if(S.qi>=S.count) finish(); else loadWord();
  },620);
}

function passWord(){
  if(!S.running||S.locked) return;
  S.locked=true;
  stopLimit();
  const r=S.results[S.results.length-1];
  if(r) r.passed=true;
  hintKey(null);
  beep(300,.1);
  S.qi++;
  if(S.qi>=S.count) finish(); else loadWord();
}

/* =========================================================
   7. けっか
========================================================= */
function finish(){
  S.running=false;S.locked=false;
  stopLimit();stopSpeak();
  hintKey(null);
  const min=S.startedAt?(Date.now()-S.startedAt)/60000:0;
  const spd=min>0?Math.round(S.keysOK/min):0;
  const tot=S.keysOK+S.keysNG;
  const acc=tot?Math.round(S.keysOK/tot*100):100;
  $("rSpeed").textContent=spd;
  $("rAcc").textContent=acc+"%";
  $("rClear").textContent=S.results.filter(r=>r.miss===0&&!r.passed&&!r.timeout).length;
  $("resultTitle").textContent = acc>=95 ? T("t_great") : acc>=85 ? T("t_good") : T("t_ok");
  recordSession(spd,acc,S.results.filter(r=>r.miss===0&&!r.passed&&!r.timeout).length);

  const b=bestStore[bestKey()];
  if(!b||spd>b.speed){ bestStore[bestKey()]={speed:spd,acc};saveBest();
    $("rBest").textContent=`${levelLabel()}・${modeLabel()}・${diffLabel()}${T("best_new")}`;
  }else{
    $("rBest").textContent=`${levelLabel()}・${modeLabel()}・${diffLabel()}${T("best_of")}${b.speed} ${T("u_speed")}`;
  }

  const ul=$("review");ul.innerHTML="";
  S.results.forEach(r=>{
    const li=document.createElement("li");
    li.innerHTML=`<span class="kw${r.t==="e"?" en":""}">${esc(r.w)}</span>
      <span class="kd"><b>${esc(r.y)}</b><span>${r.t==="e"?"":esc(r.m)}</span></span>
      ${(r.t==="e"&&window.speechSynthesis)?`<button class="spk sm" type="button" data-say="${esc(r.w)}" aria-label="発音を聞く">${SPK_ICON}</button>`:""}
      <span class="mark ${(r.passed||r.timeout)?"pass":(r.miss===0?"ok":"ng")}">${r.timeout?T("m_timeout"):r.passed?T("m_pass"):(r.miss===0?"◎":"△")}</span>`;
    ul.appendChild(li);
  });

  const ms=Object.entries(S.missMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(ms.length){
    $("missSheet").classList.remove("hidden");
    $("missKeys").textContent=ms.map(([k,n])=>`${k} … ${n}回`).join("　／　");
  }else{
    $("missSheet").classList.add("hidden");
  }
  $("scr-play").classList.add("hidden");
  $("scr-result").classList.remove("hidden");
  window.scrollTo(0,0);
}

/* =========================================================
   7.5 きろく
========================================================= */
const hist={sessions:[],words:{}};
async function loadHist(){
  try{
    const r=await window.storage.get("kanji-typing:hist");
    if(r&&r.value){const o=JSON.parse(r.value);hist.sessions=o.sessions||[];hist.words=o.words||{};}
  }catch(e){}
}
async function saveHist(){
  try{ await window.storage.set("kanji-typing:hist",JSON.stringify(hist)); }catch(e){}
}
function recordSession(spd,acc,clear){
  hist.sessions.unshift({d:Date.now(),g:S.grade,m:S.mode,f:S.diff,n:S.count,s:spd,a:acc,c:clear});
  if(hist.sessions.length>200) hist.sessions.length=200;
  S.results.forEach(r=>{
    const k=(r.t==="e"?"e:":"k:")+r.w;
    const e=hist.words[k]||(hist.words[k]={n:0,ng:0,p:0,to:0,t:r.t,y:r.y,g:S.grade});
    e.n++; e.ng+=r.miss; if(r.passed) e.p++; if(r.timeout) e.to=(e.to||0)+1;
    e.y=r.y; e.g=S.grade; e.t=r.t;
  });
  saveHist();
}
function fmtDate(t){
  const d=new Date(t),z=n=>String(n).padStart(2,"0");
  return `${d.getMonth()+1}/${d.getDate()} ${z(d.getHours())}:${z(d.getMinutes())}`;
}
function renderScoreHist(){
  const ul=$("scoreList");ul.innerHTML="";
  if(!hist.sessions.length){
    ul.innerHTML=`<li><span class="empty">${T("h_empty")}</span></li>`;
    $("scoreNote").textContent="";return;
  }
  hist.sessions.slice(0,60).forEach(v=>{
    const li=document.createElement("li");
    li.innerHTML=`<span class="when">${fmtDate(v.d)}</span>
      <span class="tag">${GRADE_LABEL[v.g]||""}・${(MODES.find(m=>m[0]===v.m)||["",""])[1]}${v.f?"・"+((DIFFS.find(d=>d[0]===v.f)||["",""])[1]):""}</span>
      <span class="num">${v.s} 打/分 ・ ${v.a}% ・ ${v.c}/${v.n}</span>`;
    ul.appendChild(li);
  });
  const t=hist.sessions.length;
  const best=hist.sessions.reduce((a,b)=>b.s>a.s?b:a);
  $("scoreNote").textContent=T("s_sum",{t:t,s:best.s,g:GRADE_LABEL[best.g]||"",d:fmtDate(best.d)});
}
let wordSortKey="n";
function renderWordHist(){
  const ul=$("wordList");ul.innerHTML="";
  const arr=Object.entries(hist.words).map(([k,v])=>({w:k.slice(2),...v}));
  if(!arr.length){
    ul.innerHTML=`<li><span class="empty">${T("h_empty")}</span></li>`;
    $("wordNote").textContent="";return;
  }
  arr.sort((a,b)=> wordSortKey==="ng" ? (b.ng-a.ng)||(b.n-a.n) : (b.n-a.n)||(b.ng-a.ng));
  arr.slice(0,100).forEach(v=>{
    const li=document.createElement("li");
    li.innerHTML=`<span class="hw${v.t==="e"?" en":""}">${esc(v.w)}</span>
      <span class="hy">${esc(v.y||"")}</span>
      <span class="cnt">${v.n}回${v.ng?` <span class="ngc">${T("w_miss")}${v.ng}</span>`:""}${v.p?` ${T("m_pass")}${v.p}`:""}${v.to?` ${T("m_timeout")}${v.to}`:""}</span>`;
    ul.appendChild(li);
  });
  const total=arr.reduce((a,b)=>a+b.n,0);
  $("wordNote").textContent=T("w_sum",{a:arr.length,t:total})+(arr.length>100?T("w_top"):"");
}
function openHist(){
  $("scr-start").classList.add("hidden");
  $("scr-hist").classList.remove("hidden");
  renderScoreHist();renderWordHist();window.scrollTo(0,0);
}

/* =========================================================
   8. 入力の受け取り
========================================================= */
const catcher=$("catcher");
let lastKd=0;
function focusCatcher(){ try{catcher.focus({preventScroll:true});}catch(e){catcher.focus();} }
window.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(!S.running) return;
  if(e.key==="Escape"){ e.preventDefault(); passWord(); return; }
  if(e.key==="Enter"){ e.preventDefault(); return; }
  if(e.key&&e.key.length===1){
    e.preventDefault();
    if(handleKey(e.key)) lastKd=Date.now();
  }
});
catcher.addEventListener("input",()=>{
  const v=catcher.value;catcher.value="";
  if(Date.now()-lastKd<60) return;
  for(const ch of v) handleKey(ch);
});
$("scr-play").addEventListener("click",()=>{ if(S.running){focusCatcher();$("tapHint").classList.add("hidden");} });
catcher.addEventListener("blur",()=>{ if(S.running) $("tapHint").classList.remove("hidden"); });
catcher.addEventListener("focus",()=>$("tapHint").classList.add("hidden"));

/* =========================================================
   9. 画面のつなぎ
========================================================= */
$("btnPass").onclick=function(){ this.blur(); passWord(); };
$("btnSpeak").innerHTML=SPK_ICON;
$("btnSpeak").onclick=function(){ this.blur(); if(S.cur&&S.cur.t==="e") speakEn(S.cur.w,true); };
$("review").addEventListener("click",e=>{
  const b=e.target.closest("[data-say]"); if(!b) return;
  b.blur(); speakEn(b.dataset.say,true);
});
$("btnStart").onclick=()=>{primeSpeech();startGame();};
$("btnAgain").onclick=()=>{primeSpeech();startGame();};
$("btnQuit").onclick=function(){
  this.blur();
  if(S.running && S.qi>0 && !window.confirm(T("c_quit"))) { focusCatcher(); return; }
  S.running=false;S.locked=false;stopLimit();stopSpeak();hintKey(null);
  $("scr-play").classList.add("hidden");$("scr-start").classList.remove("hidden");
};
$("btnHome").onclick=()=>{$("scr-result").classList.add("hidden");$("scr-start").classList.remove("hidden");window.scrollTo(0,0);};

$("btnHist").onclick=openHist;
$("btnHistBack").onclick=()=>{$("scr-hist").classList.add("hidden");$("scr-start").classList.remove("hidden");window.scrollTo(0,0);};
$("btnHistClear").onclick=function(){
  this.blur();
  if(!window.confirm(T("c_clear"))) return;
  hist.sessions=[];hist.words={};saveHist();renderScoreHist();renderWordHist();
};
$("histTabs").onclick=e=>{
  const b=e.target.closest("button"); if(!b) return;
  [...$("histTabs").children].forEach(x=>x.setAttribute("aria-pressed",x===b));
  $("tab-score").classList.toggle("hidden",b.dataset.tab!=="score");
  $("tab-words").classList.toggle("hidden",b.dataset.tab!=="words");
};
$("wordSort").onclick=e=>{
  const b=e.target.closest("button"); if(!b) return;
  [...$("wordSort").children].forEach(x=>x.setAttribute("aria-pressed",x===b));
  wordSortKey=b.dataset.sort; renderWordHist();
};

buildStart();buildKb();applyTexts();loadBest();loadHist().then(refreshGrades);
</script>
